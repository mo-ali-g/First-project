<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم الشاملة</title>
  <style>
    body {
      background-color: #333;
      color: #ffffff;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      font-family: system-ui, sans-serif;
    }
    
    fieldset {
      border: 1px solid #666;
      border-radius: 38px;
      padding: 15px 30px;
    }

    button, input[type="submit"] {
      background-color: #00d2ff;
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    dialog {
      background-color: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 20px;
      width: 90%;
    }


    .sliders-list {
      display: grid;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="range"] {
      accent-color: #00d2ff;

      width: 100%;
    }
  </style>
</head>
<body>

  <!-- الزر الأول -->
  <fieldset>
    <legend>دوس 1</legend>
    <button commandfor="box-1" command="show-modal">الإعدادات 1</button>
  </fieldset>

  <dialog id="box-1" closedby="any">
    <details open>
      <summary>الإعدادات الرئيسية</summary>
      <div class="stage"></div>
      <form method="dialog">
        <div class="sliders-list">
          <input type="range" name="r1" min="0" max="1" step="0.1">
          <input type="range" name="r2" min="0" max="888" disabled>
          <input type="range" name="r3" min="0" max="12" disabled>
          <input type="range" name="r4" min="0" max="1" disabled>
          <input type="range" name="r5" min="-10" max="-2" disabled>
          <input type="range" name="r6" min="0" max="100">
        </div>
        <input type="submit" value="تم">
      </form>
    </details>
  </dialog>

  <!-- الزر الثاني (قسم d4) -->
  <fieldset>
    <legend>دوس 2 (d4)</legend>
    <button commandfor="box-d4" command="show-modal">إعدادات d4</button>

          <input type="range" name="r2" min="0" max="888" disabled>
          <input type="range" name="r3" min="0" max="12" disabled>
          <input type="range" name="r4" min="-10" max="-2" disabled>
        </div>
        <input type="submit" value="تم">
      </form>
    </details>
  </dialog>

  <fieldset>
    <legend>دوس 3 (world)</legend>
    <button commandfor="box-world" command="show-modal">إعدادات world</button>
  </fieldset>

  <dialog id="box-world" closedby="any">

          <input type="range" name="r3" min="0" max="12" disabled>
          <input type="range" name="r4" min="-10" max="-2" disabled>
        </div>
        <input type="submit" value="تم">
      </form>
    </details>
  </dialog>
